services:
  codexproxy:
    image: ${CODEXPROXY_IMAGE:-ghcr.io/2835968102/codexproxy:latest}
    container_name: codexproxy
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: "8787"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}"
      RELAY_TOKEN: "${RELAY_TOKEN:?set RELAY_TOKEN in .env}"
      PAIRING_CODE: "${PAIRING_CODE:?set PAIRING_CODE in .env}"
